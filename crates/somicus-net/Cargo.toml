[package]
name = "somicus-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Network transports and egress boundary for Somicus"

[lints]
workspace = true

[dependencies]
sha2 = { workspace = true }
somicus-privacy = { workspace = true }
somicus-telemetry = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# WinHTTP, the HTTPS transport on Windows: the OS's own HTTP stack, not an HTTP client crate (deny.toml).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

# NSURLSession, the HTTPS transport on macOS (ADR-0049): the OS's own HTTP stack through Foundation, not an HTTP client
# crate.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSData", "NSDate", "NSError", "NSHTTPCookieStorage", "NSObjCRuntime", "NSObject", "NSOperation", "NSString", "NSURL", "NSURLAuthenticationChallenge", "NSURLCache", "NSURLCredential", "NSURLCredentialStorage", "NSURLError", "NSURLProtectionSpace", "NSURLRequest", "NSURLResponse", "NSURLSession"] }

# libcurl, the HTTPS transport on Linux (ADR-0049): the distribution's own library through the `curl` crate's safe API.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
curl = { workspace = true }

# The Mac runs the libcurl transport's tests against its own libcurl.
[target.'cfg(target_os = "macos")'.dev-dependencies]
curl = { workspace = true }

[dev-dependencies]
somicus-telemetry = { workspace = true, features = ["testing"] }
somicus-uigraph = { workspace = true }
