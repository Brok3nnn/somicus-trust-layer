name: Bug report
description: Something in the trust layer behaves differently from its documentation or tests.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here; see SECURITY.md. Never paste real personal data: use synthetic examples.
  - type: dropdown
    id: crate
    attributes:
      label: Crate
      options:
        - somicus-privacy
        - somicus-net
        - somicus-policy
        - somicus-ner
        - somicus-uigraph
        - somicus-telemetry
        - evals/privacy
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A failing test or a minimal snippet with synthetic data is ideal.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, `rustc --version`, commit.
