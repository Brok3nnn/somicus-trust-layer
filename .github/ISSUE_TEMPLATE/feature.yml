name: Feature request
description: Suggest a change to the privacy, egress or policy boundary.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can the trust layer not do, or not guarantee, today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: threat-model
    attributes:
      label: Threat-model impact
      description: Does the change widen what can leave the device, or what Somicus may do? How is it bounded?
