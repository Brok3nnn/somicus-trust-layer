name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Actions are pinned by commit; Dependabot (.github/dependabot.yml) updates the pins and their version comments.
jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # somicus-net links the distribution's libcurl on Linux (ADR-0049); macOS ships its own.
      - name: Install libcurl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config

      # The version pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  windows:
    name: clippy (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The WinHTTP backend and its Windows-only tests compile here; those tests do not run in CI yet.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config

      # The version pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Docs
        run: cargo doc --locked --no-deps --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Advisories, licences, bans (no other HTTP or WebSocket client; curl and the system stacks' bindings only in
      # somicus-net) and sources, as deny.toml sets them.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
